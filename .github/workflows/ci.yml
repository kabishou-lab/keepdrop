name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx tsx src/cli.ts eval
        env:
          OPENAI_API_KEY: ""
      - run: npx tsx src/cli.ts eval --long
        env:
          OPENAI_API_KEY: ""
      - run: npx tsx src/cli.ts compact --demo --dry-run
      - run: npx tsx src/cli.ts compact --demo --markers --quiet
